name: CI

# Type-check + build every pull request, so a change that doesn't compile
# can't reach `main`. The job name (`build`) is what you select as a required
# status check in the branch ruleset — see the finish-setup skill. Every test
# runs inside this one job, so the ruleset's one check covers them all.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Integration and UI tests against a local Supabase stack (Docker on the
      # runner; no account or secrets), started empty with our schema applied
      # (scripts/test-stack.sh). The cloud tests run the server's requests; the
      # UI tests drive a build of the app pointed at the stack (tests/e2e).
      - name: Start the test stack
        run: |
          eval "$(scripts/test-stack.sh)"
          echo "SUPABASE_TEST_URL=$SUPABASE_TEST_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_KEY=$SUPABASE_TEST_KEY" >> "$GITHUB_ENV"
      - name: Cloud integration tests
        run: npm run test:cloud
      - name: Build the app against the test stack
        run: |
          FETCH_DUCKDB_EXT=1 node scripts/fetch-duckdb-extensions.mjs
          VITE_SUPABASE_URL="$SUPABASE_TEST_URL" VITE_SUPABASE_KEY="$SUPABASE_TEST_KEY" npm run build:e2e
      - name: UI tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Keep the UI test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup || true
